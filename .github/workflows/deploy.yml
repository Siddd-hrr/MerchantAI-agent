name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            cd "$DEPLOY_PATH"

            if [ ! -f .env ]; then
              echo "ERROR: $DEPLOY_PATH/.env is missing."
              echo "Copy .env.production.example to .env on the server, fill secrets, chmod 600."
              exit 1
            fi

            git remote set-url origin https://github.com/Siddd-hrr/MerchantAI-agent.git
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

            echo "Deploy finished at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
