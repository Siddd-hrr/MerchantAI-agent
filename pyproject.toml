[project]
name = "merchant-ai-agent"
version = "0.1.0"
description = "Phase 1 Merchant AI Agent backend scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy[asyncio]",
  "asyncpg",
  "alembic",
  "redis",
  "pydantic-settings",
  "langchain-google-genai",
  "langgraph",
  "langchain-core",
  "pandas",
  "openpyxl",
  "httpx",
  "aiokafka",
  "pytest",
  "pytest-asyncio",
  "python-multipart",
  "cryptography",
  "PyJWT",
  "passlib[bcrypt]",
  "bcrypt",
  "greenlet",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: needs live Postgres/Redis (skipped when unreachable)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "services", "scripts"]

[tool.uv]
package = true
